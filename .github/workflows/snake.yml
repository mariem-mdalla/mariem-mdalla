name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: mariem-mdalla
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Move to assets
        run: |
          mkdir -p assets
          cp dist/snake-light.svg assets/snake-light.svg
          cp dist/snake-dark.svg assets/snake-dark.svg

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update contribution snake"
          branch: main
          file_pattern: "assets/snake-light.svg assets/snake-dark.svg"
