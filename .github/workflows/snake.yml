name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: mariem-mdalla
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=8b7cff&color_dots=#4fd1c5,#8b7cff,#4fd1c5,#8b7cff,#4fd1c5

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
